services:
  postgres:
    image: postgres:16
    container_name: parcelpilot-postgres
    environment:
      POSTGRES_DB: parcelpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcelpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
