issues:
  - id: H1
    title: Property or helper recomputes on every access
    endpoints: ["GET /reports/sales/{run_id}/rows", "GET /pricing/quotes/{quote_id}"]
    planted_in: ["parcelpilot/reports/models.py::Report.sorted_rows", "parcelpilot/reports/service.py::render_page"]
    visible_in: ["benign", "typical"]
    profile_signature:
      - frame: "Report.sorted_rows"
        expected_share: 0.35
      - frame: "builtins.sorted"
        expected_share: 0.22
    correct_fix_location: "parcelpilot/reports/service.py"
    fix_scope: "leaf"
    difficulty_detect: "easy"
    difficulty_fix: "easy"
    oracle: ["exact row ordering", "repeated reads stable"]
    benchmark_threshold: 10.0

  - id: H2
    title: Hidden quadratic work in list membership checks
    endpoints: ["GET /fraud/blocklist", "POST /fraud/screen", "POST /fraud/screen/batch"]
    planted_in: ["parcelpilot/config/lists.py::load_blocklists", "parcelpilot/fraud/lookup.py::is_blocked", "parcelpilot/fraud/screening.py::screen_order"]
    visible_in: ["hostile strongly", "benign weakly"]
    profile_signature:
      - frame: "list.__contains__"
        expected_share: 0.42
      - frame: "fraud.lookup.is_blocked"
        expected_share: 0.24
    correct_fix_location: "parcelpilot/config/lists.py::load_blocklists"
    fix_scope: "caller"
    difficulty_detect: "easy-medium"
    difficulty_fix: "easy-medium"
    oracle: ["2,000-order decision, score and match equality", "expired and normalized entries"]
    benchmark_threshold: 50.0

